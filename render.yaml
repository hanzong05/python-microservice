services:
  - type: web
    name: geo-predict-api
    env: python
    region: oregon
    plan: free
    runtimeVersion: python-3.11
    buildCommand: pip install -r requirements.txt
    startCommand: cd uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        fromEnv: SUPABASE_URL
      - key: SUPABASE_SERVICE_KEY
        fromEnv: SUPABASE_SERVICE_KEY
