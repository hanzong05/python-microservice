
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boreholes Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"/>
  <style>#map{height:90vh;width:100%;}</style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([15.714898333333332,120.60155666666667], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19}).addTo(map);
    L.marker([15.715506,120.623904]).addTo(map).bindPopup('BH-1');
    L.marker([15.759537,120.600182]).addTo(map).bindPopup('BH-2');
    L.marker([15.669652,120.580584]).addTo(map).bindPopup('BH-3');
  </script>
</body>
</html>
